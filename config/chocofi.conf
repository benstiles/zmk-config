# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable display support for nice!view
CONFIG_ZMK_DISPLAY=y

# Disable standard legacy OLED widgets to allow nice!view native drawing
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILTIN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONO_12=y

# Name the board
CONFIG_ZMK_KEYBOARD_NAME="Chocofi"