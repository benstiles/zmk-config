name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Multi-Board Compiler
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml', 'config/deps.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      # SUCCESS: Force-wipes broken circular cache fragments before initializing
      - name: Reset West Cache
        run: rm -rf .west/ modules/ fingerpunch/

      - name: Initialize West Workspace
        uses: zmkfirmware/zmk-actions-toolkit/setup-west@main
        with:
          manifest-path: config

      - name: Run ZMK Build Matrix
        uses: zmkfirmware/zmk-actions-toolkit/build-matrix@main
        with:
          build-yaml-path: config/build.yaml

      - name: Archive compiled firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware-binaries
          path: build/artifacts/